name: Update resource pack

on:
  workflow_dispatch:
    inputs:
      repair_modrinth:
        description: Rename existing releases and delete non-release source versions on Modrinth
        type: boolean
        default: false
  schedule:
    - cron: "30 16 * * *"

concurrency:
  group: update-resource-pack
  cancel-in-progress: false

jobs:
  repair-modrinth:
    if: inputs.repair_modrinth == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Repair Modrinth versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python modrinth.py repair --apply
      - name: Preserve repair inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modrinth-repair
          path: modrinth-repair.json

  build:
    if: inputs.repair_modrinth != true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Update language files
        run: |
          git submodule sync
          git submodule update --remote --recursive --force

      - name: Update resource pack
        run: |
          uv run mapping.py
          uv run pack.py

      - name: Commit
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "chore: update language files"

      - name: Get Minecraft version
        id: get_version
        run: |
          cd mc_lang
          cat version.txt
          echo "ver=$(<version.txt)" >> "$GITHUB_OUTPUT"

      - name: Plan missing Modrinth releases
        id: modrinth
        env:
          SOURCE_VERSION: ${{ steps.get_version.outputs.ver }}
        run: uv run modrinth.py prepare "$SOURCE_VERSION"

      - name: Release to GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.get_version.outputs.ver }}
          files: |
            output/1.7.10/renovation_translation_pack_1.7.10.zip
            output/1.8.9/renovation_translation_pack_1.8.9.zip
            output/1.9.4/renovation_translation_pack_1.9.4.zip
            output/1.10.2/renovation_translation_pack_1.10.2.zip
            output/1.11.2/renovation_translation_pack_1.11.2.zip
            output/1.12.2/renovation_translation_pack_1.12.2.zip
            output/1.13.2/renovation_translation_pack_1.13.2.zip
            output/1.14.4/renovation_translation_pack_1.14.4.zip
            output/1.15.2/renovation_translation_pack_1.15.2.zip
            output/1.16.5/renovation_translation_pack_1.16.5.zip
            output/1.17.1/renovation_translation_pack_1.17.1.zip
            output/1.18.2/renovation_translation_pack_1.18.2.zip
            output/1.19.2/renovation_translation_pack_1.19.2.zip
          name: ${{ steps.get_version.outputs.ver }}
          version: ${{ steps.get_version.outputs.ver }}

      - name: Upload resource pack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resource-packs
          path: output/**/*.zip

    outputs:
      modrinth_publish: ${{ steps.modrinth.outputs.publish }}
      modrinth_matrix: ${{ steps.modrinth.outputs.matrix }}

  upload-modrinth:
    needs: build
    if: needs.build.outputs.modrinth_publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix: ${{ fromJson(needs.build.outputs.modrinth_matrix) }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: resource-packs
          path: output

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: AO8iY7f9
          version: ${{ matrix.version }}
          name: ${{ matrix.name }}
          loaders: minecraft
          channel: release
          game-versions: ${{ toJson(matrix.game_versions) }}
          files: output/${{ matrix.mcversion }}/renovation_translation_pack_${{ matrix.mcversion }}.zip
